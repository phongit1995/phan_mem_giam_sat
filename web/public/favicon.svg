<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- Background gradient: deep navy to purple -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f36"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <!-- Q gradient: gold to amber -->
    <linearGradient id="qg" x1="50%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#e07b00"/>
    </linearGradient>
    <!-- 88 text gradient -->
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8b8ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="40" height="40" rx="9" fill="url(#bg)"/>

  <!-- Letter Q as a stylized shape -->
  <!-- Outer circle of Q -->
  <circle cx="17" cy="18" r="9" fill="none" stroke="url(#qg)" stroke-width="3.5"/>
  <!-- Q tail stroke -->
  <line x1="23" y1="23" x2="29" y2="30" stroke="url(#qg)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- "88" small text bottom right -->
  <text
    x="31"
    y="37"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="7"
    font-weight="900"
    text-anchor="middle"
    fill="url(#tg)"
  >88</text>
</svg>
